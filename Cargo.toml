[package]
name = "qqq"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first task queue for coding agent sessions"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
tempfile = "3"
toml = "0.8"
