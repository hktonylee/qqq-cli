[package]
name = "qqq-cli"
version = "0.11.0"
edition = "2024"
rust-version = "1.89"
description = "Local-first task queue for coding agent sessions"
license = "MIT"
repository = "https://github.com/hktonylee/qqq-cli"
readme = "README.md"
publish = ["crates-io"]

[[bin]]
name = "qqq"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
fs2 = "0.4"
full_moon = { version = "=3.0.0", default-features = false, features = ["luau", "serde"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
ratatui = "=0.30.2"
rusqlite = { version = "0.40", features = ["bundled", "functions", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shlex = "2"
tar = "0.4"
tempfile = "3"
toml = "1.1"
toml_edit = "0.25"
unicode-segmentation = "=1.13.3"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Level-triggered polling avoids Linux input-burst stalls in Crossterm's Mio backend.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
