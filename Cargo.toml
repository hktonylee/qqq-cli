[package]
name = "qqq-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Local-first task queue for coding agent sessions"
license = "MIT"
repository = "https://github.com/hktonylee/qqq-cli"
readme = "README.md"
publish = ["crates-io"]

[[bin]]
name = "qqq"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "=3.4.1", features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
fs2 = "0.4"
# Retain Rust 1.85 compatibility; later image releases require Rust 1.88.
image = { version = "=0.25.5", default-features = false, features = ["png"] }
ratatui = "=0.29.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"
tar = "0.4"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
unicode-segmentation = "=1.12.0"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Level-triggered polling avoids Linux input-burst stalls in Crossterm's Mio backend.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
